<!DOCTYPE html>

<body>

  <script>
    // Odd or Even 
    function oddEven(num){
      if(num % 2 == 0){
        console.log('even');
      }else console.log('odd');
    }
    oddEven(20);
    oddEven(50);
    oddEven(17);

    //larger of two
    function larger(num1 , num2){
      if(num1 > num2){
        return num1;
      }else{
        return num2;
      }
    }
    console.log(larger(40 , 30));
    console.log(larger(400 , 530));
    console.log(larger(356 , 30));

    //Celsius to Fahrenheit
    function convert(celsius){
     return  9/5 * celsius + 32;
      
    }

    console.log(convert(19));
    console.log(convert(55));
    console.log(convert(38));



  </script>
</body>
