<body>

  <script>
    // Odd or Even 
    function oddEven(num){
      if(num % 2 == 0){
        console.log('even');
      }else console.log('odd');
    }
    oddEven(20);
    oddEven(50);
    oddEven(17);

    //larger of two
    function larger(num1 , num2){
      if(num1 > num2){
        console.log(num1)
      }else console.log(num2);
    }
    larger(40 , 30);
    larger(400 , 530);
    larger(356 , 30);
    
    


  </script>
</body>
