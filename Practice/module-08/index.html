<!DOCTYPE html>
<html lang="en">
<head>
 
  <title>Practice set 8</title>
  <style>
    .btn-click{
      font-size:15px;
      height:50px;
      width:80px;
      background-color: rgb(210, 179, 179);
      color:white;
      border:none;
      border-radius: 4px;
    }
    .js-size-double{
      font-size:30px;
      height:40px;
      width:160px;
    }
  </style>
</head>
<body>
  <button class ="btn-click">Click</button>

  <script>
    let buttonElement = document.querySelector('.btn-click');
    buttonElement.addEventListener('click', event =>  setTimeout(doubleSize, 2000))

    function doubleSize(){
      let buttonElement = document.querySelector('.btn-click');
      buttonElement.classList.add('.js-size-double');
    }
    let multiply = (num1, num2) =>  num1 * num2;
    console.log(multiply(2,5));

    let printGreeting = () => console.log('Good Morning');
    let runTwice = inputFunction => {
      inputFunction();
      inputFunction();
    };
    runTwice(printGreeting);

    let arr = [1,2,3,4,5,6,7];
    let sum = 0;
    arr.forEach(num => sum += num);
    console.log(sum);

    let squares = arr.map(num => num * num);
    console.log(squares);




  </script>
</body>
</html>
