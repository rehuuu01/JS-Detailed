<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Practice set 6</title>
</head>
<body>
  <h3 id="greeting"></h3>





  <script>
    let date = new Date();
    let hour = date.getHours();
    let heading = document.querySelector('#greeting');

    if (hour > 5 && hour < 12){
      heading.innerText = 'Good Morning';
    }else if (hour >= 12 && hour < 18){
      heading.innerText = 'Good Afternoon';
    }else{
      heading.innerText = 'Good Evening';
    }
  </script>
</body>
</html>
