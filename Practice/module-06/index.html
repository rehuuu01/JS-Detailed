<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Practice set 6</title>
  <style>
    #my-button{
      height: 50px;
      width: 50px;
      font-size: 20px;
      border:none;
      border-radius: 5px;
    }
    .js-odd{
      background-color: red;
    }
    .js-even{
      background-color: green;
    }
  </style>
</head>
<body>
  <h3 id="greeting"></h3>
  <button id ="my-button" onclick="buttonPressed();">0</button>




<!-- start script-->
  <script>
    let clickedCount = localStorage.getItem('clickedCount') || 0;
    function buttonPressed(){
      console.log('Button pressed');
      clickedCount++;
      localStorage.setItem('clickedCount', clickedCount);
      updateButton();
    }
    function updateButton(){
      let button = document.querySelector('#my-button');
      if (clickedCount % 2 === 0){
        button.classList.remove('js-odd');
        button.classList.add('js-even');
      } else {
        button.classList.remove('js-even');
        button.classList.add('js-odd');
      }
      button.innerText = clickedCount;
    }
    updateButton();
    function greeting(personName){
      let date = new Date();
      let hour = date.getHours();
      let heading = document.querySelector('#greeting');       

      if (hour > 5 && hour < 12){
        heading.innerText = `Good Morning, ${personName}!`;
      }else if (hour >= 12 && hour < 18){
        heading.innerText = `Good Afternoon, ${personName}!`;
      }else{
        heading.innerText = `Good Evening, ${personName}!`;
      }
    }
    greeting("John");
  </script>
</body>
</html>
