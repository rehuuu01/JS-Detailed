<!DOCTYPE html>
<html lang="en">
<head>
  <title>Do while Loop</title>
</head>
<body>
  <h3>do while loop is used to execute a block of code at least once, and then repeatedly execute the block, or not, depending on a given boolean condition at the end of the block.</h3>


  <script>
    let i = 1; // initialization
    do {
      console.log(i);
      i++; // increment-Updating
    } while (i < 10); // condition
  </script>
</body>
</html>
