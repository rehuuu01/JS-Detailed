<!DOCTYPE html>
<html lang="en">
<head>

  <title>while Loop</title>
</head>
<body>
  <h3>while loop is used to execute a block of code as long as the specified condition is true.</h3>
  
  <script>
    let i = 1; // initialization
    while (i <= 10){ // condition
      console.log(i);
      i++;// increment-Updating
    }
  </script>
</body>
</html>
