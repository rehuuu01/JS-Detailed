<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Array </title>
</head>
<body>
  
  <script>
    //array is a collection of similar data types
    let num = [1, 2, 3, 4, 5];
    console.log(num);
    //to access the array elements we can use index number
    console.log(num[0]); // outputs 1
    console.log(num[2]); // outputs 3

    console.log(typeof num); // outputs object

  </script>
</body>
</html>
