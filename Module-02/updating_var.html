<!DOCTYPE html>
<html lang="en">
<head>
  
  <title> Updating Variables</title>
</head>
<body>
  

  <script>
   let a=10;
   let b=30;
   let c=a+5;
   console.log(c);
   c=b+5;
   console.log(c);

   //short-hand
   let i=5;
   console.log(i);
   i+=5;
   console.log(i);
   i-=1;
   console.log(i);
   i*=2;
   console.log(i);
   i/=3;
   console.log(i);
   i++;
   console.log(i);
    
  </script>
</body>
</html>
