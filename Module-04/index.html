  <script>

      let  s = x + y;
      return s;
    }
     let result = sum(4,5);
    console.log(result);
    result =  sum(10,30); // function call
    console.log(result);

    }
    eligibilityCheck(45); /* arguments('the values passed in fun call')
    console.log(res);*/
  </script>
