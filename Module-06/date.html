<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Date</title>
</head>
<body>
  

  <script>
    // Date is an In-built object

    //creates a new date obj with the current Date & Time
    let myDate = new Date();
    console.log(myDate);

    //other Key methods
    console.log(myDate.getTime());
    console.log(myDate.getFullYear());
    console.log(myDate.getDay());
    console.log(myDate.getHours());
    console.log(myDate.getMinutes());
    console.log(myDate.getMilliseconds());
  </script>
</body>
</html>
