<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>JSON</title>
</head>
<body>
  <div id="div1"></div>
  <div id="div2"></div>
  <div id="div3"></div>
  <div id="div4"></div>

  <div class="div1"></div>
  <div class="div2"></div>
  <div class="div3"></div>
  <div class="div4"></div>
  <script>
    // JSON is Data Format
    let product = {
      name: 'TShirt',
      price: 789,
      rating:{
        stars: 4.5,
        noOfReviews: 453,
      },
    };
    // stringify()
    console.log(typeof product);
    console.log(product);
    let str  = JSON.stringify(product);
    console.log(typeof str);
    console.log(str);

    // parse()
    let newProduct = JSON.parse(str);
    console.log(typeof newProduct);
    console.log(newProduct);

    
  

    


  </script>
</body>
</html>
