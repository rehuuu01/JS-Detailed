<!DOCTYPE html>
<html lang="en">
<head>
 
  <title>Event listener</title>
</head>
<body>
  <button id ="my-button">Click</button>

  <script>
    // Event listener: waits for an event to happen and then runs a function.
    let  button = document.querySelector('#my-button');
    button.addEventListener('click', event => console.log('hello world'));

    let printDate = event => console.log(new Date ());
    button.addEventListener('click', printDate);
  </script>
</body>
</html>
