<!DOCTYPE html>
<html lang="en">
<head>
  <title>Array Methods</title>
</head>
<body>

  <script>
    // filter() creates a new array containing only the items that meet a condition.
    let array = [5,6,7,8,9,10];
    let odds = array.filter((num, index) => {
      if(num %2 === 1){
        return true;
      }else{
        return false;
      }
    });
    console.log(odds);

    // map() creates a new array by changing or transforming each item in the original array.
    let arr = [1,2,3,4,5];
    let squares = arr.map(num => num * num);
    console.log(squares);
  </script>
</body>
</html>
