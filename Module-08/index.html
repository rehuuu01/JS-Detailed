<!DOCTYPE html>
<html lang="en">
<head>
  <title>For each loop</title>
</head>
<body>
  
  <script>
    // forEach() runs a function once for each item in an array.
    let array = [1,2,3,4,5];
    array.forEach((num) => console.log(num));

    function search(array, num) {
      for ( let i = 0; i < array.length; i++){
        if (array[i] === num){
          console.log(`Position:${i}`);
          return;
        }
      }
    }

    search(array, 4);
  </script>
</body>
</html>
