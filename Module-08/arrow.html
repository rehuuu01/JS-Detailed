<!DOCTYPE html>
<html lang="en">
<head>

  <title>Arrow Function</title>
</head>
<body>

  <script>
    //use '=>' instead of 'function' keyword
    let sum = (num1, num2) => {
      return num1 + num2;
    }
    console.log(sum(10,50));

    //single-argument round brackets optional
    //single-line curly brackets & return optional
    let square = num =>  num * num;
    
    console.log(square(6));
  </script>
</body>
</html>
