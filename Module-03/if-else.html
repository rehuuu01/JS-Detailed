  <title>If else</title>
</head>
<body>
  

  <script>
    let age = 18;
    if (age>18){
      console.log("You are eligible ");
    }else{
      console.log("You are not eligible");
    }

    //if else ladder
    let day = 'Wednesday';
    if(day=='Monday'){
      console.log("Monday");
    }else if(day=='Tuesday')
    {
      console.log('Tuesday');
    }else if(day=='Wednesday'){
      console.log('Wednesday')
    }
  </script>
