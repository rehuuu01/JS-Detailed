<!DOCTYPE html>
<html lang="en">
<head>
  <title>Logical Operator</title>
</head>
<body>

  <script>
    //logical 'AND'
    let age = 44;
    if(age > 18 && age < 65){
      console.log('You Can Drive');
    }else {
      console.log('You Can not Drive');
    }

    //logical 'OR'
    let age1 = 44;
    if(age1 < 18 || age1 > 65){
      console.log('You Can not Drive');
    }else{
      console.log('You Can Drive');
    }

    //logical 'NOT'
    console.log(!true);
     console.log(!false);
  </script>
  
</body>
</html>
