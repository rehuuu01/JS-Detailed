<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>If alternates</title>
</head>
<body>

  <script>
    // Ternary Operator
    let age = 25;
    let result = age >18? 'Adult':'Kid';
    console.log(result);

    // Guard Operator
    let age1;
    let finalage = age1 || 18;
    console.log(finalage);

    // Default Operator
    let age2 = 0;
    let final = age2 ?? 18;
    console.log(age2);
    console.log(final);

  </script>
  
</body>
</html>
