<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>If alternatives</title>
</head>
<body>

  <script>
    // Ternary Operator
    let age = 25;
    let result = age >18? 'Adult':'Kid';
    console.log(result);

    // Guard Operator
    let age1;
    let finalage = age1 || 18;
    console.log(finalage);


  </script>
  
</body>
</html>
