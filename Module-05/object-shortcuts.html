<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Object Shortcuts</title>
</head>
<body>
  

  <script>
    // de-structuring
    let product = {
      company: 'Mango',
      price: 861,
    };
    let {company, price} = product;
    console.log(company);
    console.log(price);

  </script>
</body>
</html>
