<!DOCTYPE html>
<html lang="en">
<head>
 
  <title>Objects</title>
</head>
<body>


  <Script>
    let product = {
      company: 'Mango',
      price: 861,
      'item-name': 'T-shirt',
    };
    console.log(product);
    console.log(typeof(product));
    console.log(product.company);
    console.log(product.price);

    // to change the values in it
    product.company = "Kiwi";
    console.log(product.company);

    // Bracket Notation
    console.log(product['company']);

    // useful when accessed using vairables
    let numPrice = 'item-name';
    console.log(product[numPrice]);

    // objects can be deleted using 'delete' keyword
    delete product.company;
    console.log(product);





  </Script>
</body>
</html>
