<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Inside Objects</title>
</head>
<body>


  <script>
    let product = {
      company: 'Mango',
      price: 861,
      'item-name': 'T-shirt',
      displayPrice: function(){
        console.log(`Price of the Product is ₹${this.price}`)
      }
    };
    product.displayPrice();
    // function inside  object is 'Method'



  </script>
</body>
</html>
