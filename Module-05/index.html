<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Autoboxing</title>
</head>
<body>

  <script>
    // automatic conversion of primitives to objects
    console.log('The sun shines brightly in the sky.'.toUpperCase());

    console.log('The sun shines brightly in the sky.'.length);

    console.log('The sun shines brightly in the sky.'.replace('sky','city'));


  </script>
</body>
</html>
